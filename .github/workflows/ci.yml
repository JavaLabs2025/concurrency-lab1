name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Права на запуск gradlew
        run: chmod +x gradlew

      - name: Сборка и тесты
        run: ./gradlew build

      - name: Пробный обед
        run: ./gradlew run --args="7 2 100000"

      - name: Отчёты тестов при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
